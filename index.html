<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>논문 번역 수집기 | Paper Translation Collector</title>
  <link rel="stylesheet" href="styles/index.css">
  <link rel="stylesheet" href="styles/home.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Pretendard font for Korean text -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-content">
      <h1>📚 논문 번역 수집기</h1>
      <p>최신 학술 논문을 한글로 편하게 읽어보세요.</p>
    </div>
  </header>

  <main class="container">
    <div class="controls">
      <div style="display: flex; gap: 10px; flex: 1; max-width: 500px; align-items: center;">
        <input type="text" id="searchInput" placeholder="논문 제목이나 저자로 검색..." class="search-input" style="flex: 1;">
        <button id="resetFilters" class="reset-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"></path>
          </svg>
          초기화
        </button>
      </div>
      <div class="view-toggles">
        <button id="gridViewBtn" class="toggle-btn active" aria-label="그리드 뷰">
          <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
          </svg>
        </button>
        <button id="listViewBtn" class="toggle-btn" aria-label="리스트 뷰">
          <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </div>

    <section id="paperList" class="paper-grid">
      <!-- 논문 카드들이 동적으로 추가될 영역 -->
      <div class="loading-state">논문 데이터를 불러오는 중...</div>
    </section>
  </main>

  <footer class="app-footer">
    <p>&copy; 2026 Paper Translation Collector. All rights reserved.</p>
  </footer>

  <script src="scripts/data.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
